<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4fa3">
<title>중국어 단어장</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--ink:#14233b;--sub:#5d6b82;--blue:#1f4fa3;--soft:#dde7f7;--ok:#1f8a5b;--no:#c0392b;--line:#d3dcec}
@media(prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#18223a;--ink:#eaf0fb;--sub:#9aa9c4;--blue:#7aa2ee;--soft:#22304f;--ok:#4cc38a;--no:#f0766a;--line:#2b3957}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:4px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button,.chip,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer}
.tabs button{flex:1}
.tabs .on,.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{padding:5px 10px;font-size:13px}
.opts{display:flex;gap:14px;font-size:14px;color:var(--sub);margin-bottom:10px;flex-wrap:wrap}
.opts label{display:flex;gap:5px;align-items:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;user-select:none}
.hz{font:600 54px/1.2 "Songti SC","Noto Serif SC","Noto Serif KR",serif}
.py{font-size:24px;color:var(--blue);margin-top:6px}
.mn{font-size:22px;margin-top:6px}
.tag{font-size:12px;color:var(--sub);margin-top:14px}
.row{display:flex;gap:10px;margin-top:12px}
.row .btn{flex:1;padding:14px;font-weight:600}
.no{color:var(--no)}.ok{color:var(--ok)}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:14px;margin-bottom:6px}
.q{font-size:26px;font-weight:600;text-align:center;margin:18px 0}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans .btn{font:600 26px "Songti SC","Noto Serif SC",serif;padding:18px 6px}
.ans .btn small{display:block;font:14px system-ui;color:var(--blue);min-height:20px}
.ans .right{border-color:var(--ok);background:var(--soft)}.ans .wrong{border-color:var(--no)}
input[type=search]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px}
.li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.li b{font:600 20px "Songti SC","Noto Serif SC",serif;min-width:92px}
.li span{color:var(--blue);font-size:14px;min-width:96px}
.li i{font-style:normal;color:var(--sub);font-size:14px}
.stat{color:var(--sub);font-size:13px;text-align:center;margin-top:12px}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>중국어 단어장</h1>
<div class="tabs" id="tabs"><button data-t="card" class="on">카드</button><button data-t="quiz">퀴즈</button><button data-t="list">목록</button></div>
<div class="chips" id="chips"></div>
<div class="opts">
<label><input type="checkbox" id="weak"> 복습만(2번 미만 맞힌 단어)</label>
<label><input type="checkbox" id="rev"> 뜻 먼저 보기</label>
</div>
<section id="card"></section>
<section id="quiz" class="hide"></section>
<section id="list" class="hide"></section>
<div class="stat" id="stat"></div>
</main>
<script>

const W=[];let cu;
RAW.split('\n').forEach(l=>{if(l[0]=='#')cu=l.slice(1);else if(l.trim()){const[h,p,m]=l.split('|');W.push({h,p,m,u:cu,id:cu+h})}});
const U=[...new Set(W.map(w=>w.u))];
const $=id=>document.getElementById(id);
let S={sel:U.slice(),known:{},wrong:{}};
try{const s=JSON.parse(localStorage.getItem('zhvocab')||'null');if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem('zhvocab',JSON.stringify(S))}catch(e){}};
const shuf=a=>{a=a.slice();for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let VZ=[];const ld=()=>{VZ=speechSynthesis.getVoices()};try{ld();speechSynthesis.onvoiceschanged=ld}catch(e){}
let AU;
const say=t=>{try{
const v=VZ.find(v=>/^(zh|cmn)[-_]CN/i.test(v.lang))||VZ.find(v=>/^(zh|cmn)/i.test(v.lang));
if(v){const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;u.voice=v;speechSynthesis.cancel();setTimeout(()=>speechSynthesis.speak(u),60)}
else{if(AU)AU.pause();AU=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q='+encodeURIComponent(t));AU.play().catch(()=>{})}
}catch(e){}};
const label=u=>'S'+u.replace('-','·U');
const deck=()=>W.filter(w=>S.sel.includes(w.u)&&(!$('weak').checked||(S.known[w.id]||0)<2));
let tab='card',q=[],qi=0,flip=false,score=[0,0],lock=false;
function chips(){$('chips').innerHTML='<button class="chip" data-a="all">전체</button>'+U.map(u=>`<button class="chip ${S.sel.includes(u)?'on':''}" data-u="${u}">${label(u)}</button>`).join('')}
$('chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.a)S.sel=S.sel.length==U.length?[]:U.slice();else{const u=b.dataset.u;S.sel=S.sel.includes(u)?S.sel.filter(x=>x!=u):[...S.sel,u]}
save();chips();reset()};
$('weak').onchange=$('rev').onchange=()=>reset();
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;
[...$('tabs').children].forEach(x=>x.classList.toggle('on',x==b));
['card','quiz','list'].forEach(t=>$(t).classList.toggle('hide',t!=tab));reset()};
function reset(){q=shuf(deck());qi=0;flip=false;score=[0,0];lock=false;render()}
function render(){
const d=deck();$('stat').textContent=`선택한 단어 ${d.length}개 · 전체 ${W.length}개 · 외운 단어 ${W.filter(w=>(S.known[w.id]||0)>=2).length}개`;
if(tab=='card')card();else if(tab=='quiz')quiz();else list()}
function empty(el){el.innerHTML='<p class="stat">표시할 단어가 없어요. 유닛을 고르거나 "복습만"을 꺼 보세요.</p>'}
function card(){const el=$('card');if(!q.length)return empty(el);
if(qi>=q.length){el.innerHTML=`<div class="card" id="again"><div class="mn">한 바퀴 끝!</div><div class="tag">탭해서 다시 시작</div></div>`;$('again').onclick=reset;return}
const w=q[qi],rev=$('rev').checked;
const front=rev?`<div class="mn">${w.m}</div>`:`<div class="hz">${w.h}</div>`;
const back=rev?`<div class="hz">${w.h}</div><div class="py">${w.p}</div>`:`<div class="py">${w.p}</div><div class="mn">${w.m}</div>`;
el.innerHTML=`<div class="meta"><span>${qi+1} / ${q.length}</span><span>${label(w.u)}</span></div>
<div class="card" id="cd">${flip?back:front}<div class="tag">${flip?'':'탭해서 뒤집기'}</div></div>
<div class="row"><button class="btn" id="sp">🔊 듣기</button></div>
<div class="row"><button class="btn no" id="bn">몰라요</button><button class="btn ok" id="by">알아요</button></div>`;
$('cd').onclick=()=>{flip=!flip;if(flip)say(w.h);card()};
$('sp').onclick=()=>say(w.h);
const next=k=>{if(k){S.known[w.id]=(S.known[w.id]||0)+1}else{S.known[w.id]=0;S.wrong[w.id]=(S.wrong[w.id]||0)+1;q.push(w)}save();qi++;flip=false;render()};
$('bn').onclick=()=>next(0);$('by').onclick=()=>next(1)}
function quiz(){const el=$('quiz'),d=deck();
if(d.length<4)return el.innerHTML='<p class="stat">퀴즈는 단어가 4개 이상 필요해요.</p>';
if(qi>=q.length){el.innerHTML=`<div class="card" id="again"><div class="mn">${score[0]} / ${score[0]+score[1]} 정답</div><div class="tag">탭해서 다시 시작</div></div>`;$('again').onclick=reset;return}
const w=q[qi],opts=shuf([w,...shuf(W.filter(x=>x.id!=w.id&&x.h!=w.h)).slice(0,3)]);lock=false;
el.innerHTML=`<div class="meta"><span>${qi+1} / ${q.length}</span><span>정답 ${score[0]}</span></div>
<div class="q">${w.m}</div><div class="ans">${opts.map(o=>`<button class="btn" data-i="${o.id}">${o.h}<small></small></button>`).join('')}</div>`;
el.querySelector('.ans').onclick=e=>{const b=e.target.closest('button');if(!b||lock)return;lock=true;
const ok=b.dataset.i==w.id;
el.querySelectorAll('button').forEach(x=>{const o=W.find(v=>v.id==x.dataset.i);x.querySelector('small').textContent=o.p;if(o.id==w.id)x.classList.add('right')});
if(ok){score[0]++;S.known[w.id]=(S.known[w.id]||0)+1}else{score[1]++;b.classList.add('wrong');S.known[w.id]=0;S.wrong[w.id]=(S.wrong[w.id]||0)+1}
save();say(w.h);setTimeout(()=>{qi++;render()},ok?900:1800)}}
function list(){const el=$('list');
el.innerHTML='<input type="search" id="sr" placeholder="한자, 병음, 뜻 검색">'+'<div id="lw"></div>';
const draw=()=>{const t=$('sr').value.trim().toLowerCase();
$('lw').innerHTML=deck().filter(w=>!t||(w.h+w.p+w.m).toLowerCase().includes(t)).map(w=>`<div class="li" data-h="${w.h}"><b>${w.h}</b><span>${w.p}</span><i>${w.m}</i></div>`).join('')||'<p class="stat">검색 결과가 없어요.</p>'};
$('sr').oninput=draw;$('lw').onclick=e=>{const r=e.target.closest('.li');if(r)say(r.dataset.h)};draw()}
chips();reset();
</script>
</body>
</html>
